<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>منصة خدمات - Khdamat</title>
    <script>
    window.onerror = function(msg, url, line) {
        alert("⚠️ خطأ في السطر " + line + ":\n" + msg);
        return false;
    };
    </script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div id="auth-container">
        <div id="login-screen" class="container" style="margin-top: 40px;">
            <div class="card" style="text-align:center;">
                <div style="display:flex; justify-content:flex-end; margin-bottom:10px; gap:8px;">
                    <button class="theme-toggle" id="btn-lang-top" style="background:var(--primary);"><i class="fa-solid fa-language"></i></button>
                    <button class="theme-toggle" id="btn-theme-top" style="background:var(--primary);"><i class="fa-solid fa-moon"></i></button>
                </div>
                <img src="73a4c087-8b39-4c4b-939e-ec4941fdb542%20(1).png" alt="Logo" class="logo-img" onerror="this.src='https://cdn-icons-png.flaticon.com/512/3135/3135715.png'">
                <h2 style="color:var(--primary); margin-bottom:5px;" data-i18n="app_name">منصة خدمات</h2>
                <p style="color:var(--text-muted); font-size:13px; margin-bottom:20px;" data-i18n="login_title">سجل دخولك</p>
                <input type="email" id="login-email" data-i18n-placeholder="email" placeholder="البريد الإلكتروني">
                <input type="password" id="login-password" data-i18n-placeholder="password" placeholder="كلمة المرور">
                <button class="btn btn-primary" id="btn-do-login" data-i18n="login_btn">دخول</button>
                <a href="#" id="link-to-signup" style="color:var(--accent); font-size:14px; font-weight:bold; text-decoration:none; display:block; margin-top:10px;" data-i18n="create_acc">أنشئ حساباً جديداً</a>
            </div>
        </div>
        <div id="signup-screen" class="container hidden" style="margin-top: 30px;">
            <div class="card" style="text-align:center;">
                <img src="73a4c087-8b39-4c4b-939e-ec4941fdb542%20(1).png" alt="Logo" class="logo-img" onerror="this.src='https://cdn-icons-png.flaticon.com/512/3135/3135715.png'">
                <h2 style="color:var(--accent); margin-bottom:15px;" data-i18n="signup_title">حساب جديد</h2>
                <input type="text" id="signup-name" data-i18n-placeholder="full_name" placeholder="الاسم الكامل">
                <input type="email" id="signup-email" data-i18n-placeholder="email" placeholder="البريد الإلكتروني">
                <input type="text" id="signup-phone" data-i18n-placeholder="phone" placeholder="رقم الهاتف">
                <input type="password" id="signup-password" data-i18n-placeholder="password" placeholder="كلمة المرور">
                <select id="signup-role">
                    <option value="user" data-i18n="role_user">صاحب عمل (أطلب خدمة)</option>
                    <option value="provider" data-i18n="role_provider">مزود خدمة (أقدم خدمة)</option>
                </select>
                <button class="btn btn-accent" id="btn-do-signup" data-i18n="signup_btn">تسجيل</button>
                <a href="#" id="link-to-login" style="color:var(--primary); font-size:14px; font-weight:bold; text-decoration:none; display:block; margin-top:10px;" data-i18n="have_acc">لديك حساب؟ سجل الدخول</a>
            </div>
        </div>
    </div>

    <div id="main-app" class="hidden">
        <div class="header">
            <h1>
                <img src="73a4c087-8b39-4c4b-939e-ec4941fdb542%20(1).png" alt="Logo" class="logo-header" onerror="this.style.display='none'">
                <span data-i18n="app_name_short">خدمات</span>
            </h1>
            <div style="display:flex; gap:8px; align-items:center;">
                <button class="theme-toggle" id="btn-lang-main"><i class="fa-solid fa-language"></i></button>
                <button class="theme-toggle" id="btn-notifications" style="position:relative;">
    <i class="fa-solid fa-bell"></i>
    <span id="notif-badge" class="hidden" style="position:absolute; top:-5px; right:-5px; background:red; color:white; border-radius:50%; font-size:12px; padding:2px 6px; font-weight:bold;">0</span>
</button>
                <button class="theme-toggle" id="btn-theme-main"><i class="fa-solid fa-moon"></i></button>
                <button class="theme-toggle" id="btn-profile"><i class="fa-solid fa-user"></i></button>
                <button class="theme-toggle" id="btn-logout"><i class="fa-solid fa-power-off"></i></button>
            </div>
        </div>
        <div class="container">
            <div id="page-home" class="page"></div>
            <div id="page-wallet" class="page hidden"></div>
            <div id="page-services" class="page hidden"></div>
            <div id="page-orders" class="page hidden"></div>
            <div id="page-admin" class="page hidden"></div>
        </div>
        <div class="bottom-nav">
            <div class="nav-item active" id="nav-home" onclick="navTo('home')"><i class="fa-solid fa-house"></i><span data-i18n="nav_home">الرئيسية</span></div>
            <div class="nav-item" id="nav-services" onclick="navTo('services')"><i class="fa-solid fa-list-check"></i><span data-i18n="nav_services">الخدمات</span></div>
            <div class="nav-item" id="nav-wallet" onclick="navTo('wallet')"><i class="fa-solid fa-wallet"></i><span data-i18n="nav_wallet">المحفظة</span></div>
            <div class="nav-item" id="nav-orders" onclick="navTo('orders')"><i class="fa-solid fa-clipboard-list"></i><span data-i18n="nav_orders">طلباتي</span></div>
            <div class="nav-item hidden" id="nav-admin" onclick="navTo('admin')"><i class="fa-solid fa-shield-halved"></i><span data-i18n="nav_admin">الإدارة</span></div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="app.js"></script>
</body>
</html>
