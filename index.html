<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>منصة خدمات</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root { --primary: #1e7d22; --primary-light: #3aa935; --accent: #f39200; --bg: #f4f7f6; --card-bg: #ffffff; --text: #333333; --border: #dddddd; }
        [data-theme="dark"] { --bg: #121212; --card-bg: #1e1e1e; --text: #e0e0e0; --border: #333333; }
        * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, sans-serif; margin: 0; padding: 0; }
        body { background: var(--bg); color: var(--text); padding: 20px; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .card { background: var(--card-bg); border-radius: 16px; padding: 25px; width: 100%; max-width: 400px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        input, select { width: 100%; padding: 12px; margin-bottom: 12px; border: 1px solid var(--border); border-radius: 8px; font-size: 15px; background: var(--bg); color: var(--text); }
        .btn { width: 100%; padding: 12px; border: none; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; margin-bottom: 10px; color: white; }
        .btn-primary { background: var(--primary); }
        .btn-accent { background: var(--accent); }
        .hidden { display: none !important; }
        .link { color: var(--accent); cursor: pointer; font-weight: bold; text-decoration: none; font-size: 14px; display: block; text-align: center; margin-top: 15px;}
        h2 { text-align: center; margin-bottom: 20px; color: var(--primary); }
    </style>
</head>
<body>

    <!-- شاشة الدخول -->
    <div id="login-screen" class="card">
        <h2>منصة خدمات</h2>
        <input type="email" id="login-email" placeholder="البريد الإلكتروني">
        <input type="password" id="login-password" placeholder="كلمة المرور">
        <button class="btn btn-primary" onclick="window.doLogin()">دخول</button>
        <a href="#" class="link" onclick="window.showSignup(event)">إنشاء حساب جديد</a>
    </div>

    <!-- شاشة التسجيل -->
    <div id="signup-screen" class="card hidden">
        <h2>حساب جديد</h2>
        <input type="text" id="signup-name" placeholder="الاسم الكامل">
        <input type="email" id="signup-email" placeholder="البريد الإلكتروني">
        <input type="text" id="signup-phone" placeholder="رقم الهاتف">
        <input type="password" id="signup-password" placeholder="كلمة المرور">
        <select id="signup-role">
            <option value="user">صاحب عمل (أطلب خدمة)</option>
            <option value="provider">مزود خدمة (أقدم خدمة)</option>
        </select>
        <button class="btn btn-accent" onclick="window.doSignup()">تسجيل</button>
        <a href="#" class="link" onclick="window.showLogin(event)">لديك حساب؟ سجل الدخول</a>
    </div>

    <!-- لوحة التحكم (تظهر بعد الدخول) -->
    <div id="dashboard-screen" class="card hidden" style="text-align: center;">
        <h2 id="welcome-msg">مرحباً</h2>
        <p style="margin-bottom: 20px;">أنت مسجل الآن بنجاح.</p>
        <div id="role-info" style="padding: 15px; background: var(--bg); border-radius: 8px; margin-bottom: 20px;"></div>
        <button class="btn btn-primary" onclick="window.doLogout()">تسجيل الخروج</button>
    </div>

    <script>
        // إعدادات Supabase
        const SUPABASE_URL = 'https://ggaxlmhzdeczhgyjwyct.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_Dy1TLIvbtiEEJM89KY9JzQ_eip7fCUI';
        const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        // التبديل بين الشاشات
        window.showSignup = function(e) {
            e.preventDefault();
            document.getElementById('login-screen').classList.add('hidden');
            document.getElementById('signup-screen').classList.remove('hidden');
        };

        window.showLogin = function(e) {
            e.preventDefault();
            document.getElementById('signup-screen').classList.add('hidden');
            document.getElementById('login-screen').classList.remove('hidden');
        };

        // دالة إنشاء حساب
        window.doSignup = async function() {
            const name = document.getElementById('signup-name').value.trim();
            const email = document.getElementById('signup-email').value.trim();
            const phone = document.getElementById('signup-phone').value.trim();
            const password = document.getElementById('signup-password').value;
            const role = document.getElementById('signup-role').value;

            if (!name || !email || !phone || !password) {
                return Swal.fire('تنبيه', 'الرجاء ملء جميع الحقول', 'warning');
            }

            Swal.fire({ title: 'جاري الإنشاء...', allowOutsideClick: false, didOpen: () => Swal.showLoading() });

            const { error } = await _supabase.auth.signUp({
                email, password,
                options: { data: { full_name: name, role: role, phone: phone } }
            });

            if (error) {
                Swal.fire('خطأ', error.message, 'error');
            } else {
                Swal.fire('تم', 'تم إنشاء الحساب بنجاح! سجل الدخول الآن.', 'success');
                window.showLogin(new Event('click'));
            }
        };

        // دالة تسجيل الدخول
        window.doLogin = async function() {
            const email = document.getElementById('login-email').value.trim();
            const password = document.getElementById('login-password').value;

            if (!email || !password) {
                return Swal.fire('تنبيه', 'أدخل البريد وكلمة المرور', 'warning');
            }

            Swal.fire({ title: 'جاري التحقق...', allowOutsideClick: false, didOpen: () => Swal.showLoading() });

            const { data, error } = await _supabase.auth.signInWithPassword({ email, password });

            if (error) {
                Swal.fire('فشل الدخول', 'بيانات الدخول غير صحيحة', 'error');
                return;
            }

            // جلب الملف الشخصي لمعرفة الدور
            const { data: profile } = await _supabase.from('profiles').select('*').eq('id', data.user.id).single();
            
            Swal.close();

            if (!profile) {
                Swal.fire('خطأ', 'الملف الشخصي غير موجود', 'error');
                return;
            }

            // إخفاء شاشات الدخول وإظهار لوحة التحكم
            document.getElementById('login-screen').classList.add('hidden');
            document.getElementById('signup-screen').classList.add('hidden');
            document.getElementById('dashboard-screen').classList.remove('hidden');

            // تخصيص لوحة التحكم حسب الدور
            document.getElementById('welcome-msg').innerText = 'مرحباً، ' + profile.full_name;
            
            let roleText = '';
            let color = '';
            if (profile.role === 'admin') { roleText = 'مدير النظام (Admin)'; color = 'var(--accent)'; }
            else if (profile.role === 'provider') { roleText = 'مزود خدمة (Provider)'; color = 'var(--primary)'; }
            else { roleText = 'صاحب عمل (User)'; color = '#007bff'; }

            document.getElementById('role-info').innerHTML = `دورك في المنصة: <b style="color:${color}">${roleText}</b>`;
        };

        // دالة تسجيل الخروج
        window.doLogout = async function() {
            await _supabase.auth.signOut();
            location.reload();
        };

        // التحقق من الجلسة عند فتح الصفحة
        (async function checkSession() {
            const { data: { session } } = await _supabase.auth.getSession();
            if (session) {
                const { data: profile } = await _supabase.from('profiles').select('*').eq('id', session.user.id).single();
                if (profile) {
                    document.getElementById('login-screen').classList.add('hidden');
                    document.getElementById('dashboard-screen').classList.remove('hidden');
                    document.getElementById('welcome-msg').innerText = 'مرحباً، ' + profile.full_name;
                    
                    let roleText = profile.role === 'admin' ? 'مدير' : (profile.role === 'provider' ? 'مزود خدمة' : 'صاحب عمل');
                    document.getElementById('role-info').innerHTML = `دورك في المنصة: <b>${roleText}</b>`;
                }
            }
        })();
    </script>
</body>
</html>
